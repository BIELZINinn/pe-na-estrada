<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff1c9">
<title>Pé na Estrada — Missões CCB</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div id="splash">
  <div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="hill h1"></div><div class="hill h2"></div>
  <div class="stage">
    <img class="bird" src="logo.svg" alt="">
    <div class="steps"><i>👣</i><i>👣</i><i>👣</i></div>
    <h1 class="title" id="splTitle" aria-label="Pé na Estrada"></h1>
    <div class="ribbon"><span>⛪ Missões CCB</span></div>
  </div>
  <div class="loader"><i></i></div><p class="hint">Preparando a estrada…</p>
</div>
<div id="map"></div>

<header id="top">
  <div class="brand"><img class="mascot" src="logo.svg" alt=""> <b>Pé na Estrada</b><span id="kmTotal">0 km</span></div>
  <div class="top-actions">
    <button id="btn3d" title="Alternar 2D/3D">2D</button>
    <button id="btnLayers" title="Camadas">🗺️</button>
  </div>
</header>

<div id="fabs">
  <button id="fabLocate" class="fab" title="Minha posição">📍</button>
  <button id="fabTrack" class="fab" title="Gravar trajeto">⏺</button>
  <button id="fabMark" class="fab primary" title="Marcar aqui">＋</button>
</div>

<div id="trackBar" hidden><span class="dot"></span> Gravando trajeto · <b id="trackKm">0,0 km</b> <button id="trackStop">Parar</button></div>

<nav id="tabs">
  <button data-tab="explorar" class="on">🧭<span>Mapa</span></button>
  <button data-tab="viagem">🧳<span>Viagem</span></button>
  <button data-tab="ccb">⛪<span>CCB</span></button>
  <button data-tab="memorias">📸<span>Memórias</span></button>
</nav>

<section id="sheet" class="hidden">
  <div id="sheetHandle"></div>
  <div id="sheetBody"></div>
</section>

<div id="toast" hidden></div>
<input type="file" id="photoInput" accept="image/*" capture="environment" hidden multiple>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="config.js?v=2"></script>
<script src="version.js?v=1" onerror="void 0"></script>
<script src="app.js?v=4"></script>
<script src="extras.js?v=3"></script>
<script src="sync.js?v=3"></script>
<script src="offline.js?v=2"></script>
<script src="nav.js?v=2"></script>
<script src="fx.js?v=1"></script>
</body>
</html>
