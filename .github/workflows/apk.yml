name: Gerar APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['*.js', '*.css', 'index.html', 'manifest.json', '*.svg', 'tools/**', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: BUILD_NUM=${{ github.run_number }} bash tools/build-apk.sh
      - uses: actions/upload-artifact@v4
        with: { name: PeNaEstrada-apk, path: PeNaEstrada.apk }
      - name: Publicar na aba Releases
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "v1.${{ github.run_number }}" PeNaEstrada.apk --target "${{ github.sha }}" --latest --title "Pé na Estrada v1.${{ github.run_number }}" --notes "APK para Android. Baixe e instale por cima da versão antiga (os dados ficam)."
